name: devsu-challenge
services:
  shared-db:
    image: postgres:16-alpine
    container_name: devsu-shared-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SHARED_DB_NAME:-devsu}
      POSTGRES_USER: ${SHARED_DB_USER:-devsu}
      POSTGRES_PASSWORD: ${SHARED_DB_PASSWORD:-devsu}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${SHARED_DB_PORT:-5433}:5432"
    volumes:
      - shared-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHARED_DB_USER:-devsu} -d ${SHARED_DB_NAME:-devsu}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  identity-api:
    build:
      context: .
      dockerfile: src/Identity/Identity.Api/Dockerfile
    container_name: devsu-identity-api
    restart: unless-stopped
    depends_on:
      shared-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      RunMigrationsOnStartup: "true"
      ConnectionStrings__Identity: "Host=shared-db;Port=5432;Database=${SHARED_DB_NAME:-devsu};Username=${SHARED_DB_USER:-devsu};Password=${SHARED_DB_PASSWORD:-devsu}"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: ${RABBITMQ_USER:-devsu}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-devsu}
      OpenTelemetry__OtlpEndpoint: "http://aspire-dashboard:18889"
    ports:
      - "${IDENTITY_API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  account-api:
    build:
      context: .
      dockerfile: src/Account/Account.Api/Dockerfile
    container_name: devsu-account-api
    restart: unless-stopped
    depends_on:
      shared-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      RunMigrationsOnStartup: "true"
      ConnectionStrings__Account: "Host=shared-db;Port=5432;Database=${SHARED_DB_NAME:-devsu};Username=${SHARED_DB_USER:-devsu};Password=${SHARED_DB_PASSWORD:-devsu}"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: ${RABBITMQ_USER:-devsu}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-devsu}
      Redis__ConnectionString: "redis:6379"
      OpenTelemetry__OtlpEndpoint: "http://aspire-dashboard:18889"
    ports:
      - "${ACCOUNT_API_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: devsu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: devsu-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-devsu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-devsu}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.1
    container_name: devsu-aspire-dashboard
    restart: unless-stopped
    environment:
      DASHBOARD__OTLP__AUTHMODE: Unsecured
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "${ASPIRE_DASHBOARD_OTLP_PORT:-18889}:18889"

volumes:
  shared-db-data:
  redis-data:
  rabbitmq-data:
